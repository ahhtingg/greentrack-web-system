<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration Successful | GreenTrack</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    *{
      box-sizing:border-box;
      font-family:"Segoe UI", sans-serif;
    }

    body{
      margin:0;
      min-height:100vh;
      background:radial-gradient(circle at top, #1f3d2b, #0b1a13);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      color:#e9f5ee;
      padding:20px;
    }

    .success-box{
      background:rgba(0, 0, 0, 0.45);
      border-radius:18px;
      padding:50px 40px;
      text-align:center;
      width:100%;
      max-width:430px;
      box-shadow:0 20px 50px rgba(0,0,0,0.6);
      position:relative;
      z-index:2;
    }

    .success-icon{
      font-size:64px;
      margin-bottom:15px;
      animation:pop 0.6s ease-out;
    }

    @keyframes pop{
      0%{ transform:scale(0.6); opacity:0; }
      100%{ transform:scale(1); opacity:1; }
    }

    h1{
      margin:10px 0;
      font-size:28px;
      color:#7CFFB2;
    }

    p{
      font-size:15px;
      opacity:0.92;
      line-height:1.7;
      margin-bottom:30px;
    }

    .btn{
      display:inline-block;
      padding:12px 28px;
      background:linear-gradient(135deg, #39c172, #2ea44f);
      color:#fff;
      border-radius:30px;
      text-decoration:none;
      font-weight:600;
      box-shadow:0 8px 20px rgba(46,164,79,0.35);
      transition:transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover{
      transform:translateY(-2px);
      box-shadow:0 12px 28px rgba(46,164,79,0.5);
    }

    .sub-link{
      margin-top:18px;
      font-size:14px;
      color:#cfe7d8;
    }

    .sub-link a{
      color:#7CFFB2;
      text-decoration:none;
      font-weight:600;
    }

    .firework{
      position:absolute;
      width:6px;
      height:6px;
      background:transparent;
      border-radius:50%;
      animation:explode 1.5s ease-out forwards;
      z-index:1;
    }

    @keyframes explode{
      0%{
        transform:scale(0.2);
        opacity:1;
      }
      100%{
        transform:scale(4);
        opacity:0;
      }
    }
  </style>
</head>
<body>

  <div class="success-box">
    <div class="success-icon">🎉</div>
    <h1>Registration Successful!</h1>
    <p>
      Your account has been created successfully. Welcome to GreenTrack.
      You can now continue to the login page and sign in with your new account.
    </p>

    <a href="/login" class="btn">Proceed to Login</a>

    <div class="sub-link">
      Back to <a href="/">Home Page</a>
    </div>
  </div>

  <script>
    function createFirework() {
      const fw = document.createElement("div");
      fw.className = "firework";
      fw.style.left = Math.random() * window.innerWidth + "px";
      fw.style.top = Math.random() * window.innerHeight + "px";
      fw.style.boxShadow = `
        0 0 10px #7CFFB2,
        0 0 20px #39c172,
        0 0 30px #2ea44f
      `;
      document.body.appendChild(fw);

      setTimeout(() => fw.remove(), 1500);
    }

    for (let i = 0; i < 8; i++) {
      setTimeout(createFirework, i * 300);
    }
  </script>

</body>
</html>
