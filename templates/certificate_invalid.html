<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Invalid Certificate | GreenTrack</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:"Segoe UI", Arial, sans-serif;
}

body{
  min-height:100vh;
  background:#f4f7f5;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px;
  color:#23352b;
}

.card{
  width:100%;
  max-width:400px;
  background:white;
  border-radius:20px;
  padding:34px 28px;
  box-shadow:0 10px 28px rgba(0,0,0,0.08);
  border:1px solid #e7ece9;
  text-align:center;
}

.icon{
  font-size:46px;
  margin-bottom:12px;
}

h1{
  font-size:32px;
  color:#c62828;
  margin-bottom:10px;
  font-weight:800;
}

.sub{
  font-size:15px;
  color:#66756d;
  line-height:1.8;
  margin-bottom:20px;
}

.status{
  display:inline-block;
  padding:10px 18px;
  border-radius:999px;
  font-weight:800;
  font-size:13px;
  background:#fff4f4;
  color:#c62828;
  border:1px solid #f0caca;
  letter-spacing:0.4px;
  margin-bottom:24px;
}

.info-box{
  background:#fafcfa;
  border:1px solid #ecefed;
  border-radius:14px;
  padding:16px;
  margin-bottom:22px;
  color:#5f6d66;
  font-size:14px;
  line-height:1.8;
}

.btn{
  display:block;
  width:100%;
  padding:13px 18px;
  background:#33715a;
  color:white;
  text-decoration:none;
  border-radius:12px;
  font-weight:700;
  text-align:center;
  transition:0.2s ease;
}

.btn:hover{
  background:#285946;
}

.note{
  margin-top:16px;
  font-size:12px;
  color:#8a9690;
}

@media(max-width:600px){
  .card{
    padding:28px 20px;
  }

  h1{
    font-size:28px;
  }
}
</style>
</head>
<body>

<div class="card">
  <div class="icon">❌</div>
  <h1>Invalid Certificate</h1>
  <p class="sub">
    The certificate ID could not be found in the GreenTrack verification system.
  </p>

  <div class="status">NOT VALID</div>

  <div class="info-box">
    Please check the certificate ID or QR code and try again.  
    If the problem continues, contact the system administrator.
  </div>

  <a href="/" class="btn">Back to Home</a>

  <div class="note">
    GreenTrack Certificate Verification
  </div>
</div>

</body>
</html>
