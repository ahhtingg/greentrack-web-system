<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Publish Recycling Event – GreenTrack</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{ box-sizing:border-box; }

body{
    font-family:"Segoe UI", sans-serif;
    background:linear-gradient(135deg,#dfeeea,#f4f6f8);
    margin:0;
    padding:30px;
}

.container{
    max-width:900px;
    margin:auto;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
    gap:12px;
    flex-wrap:wrap;
}

.back-btn{
    display:inline-block;
    text-decoration:none;
    background:#eef8f1;
    color:#1b5e20;
    border:1px solid #cfe4d4;
    padding:10px 16px;
    border-radius:12px;
    font-weight:700;
}

.back-btn:hover{
    background:#e3f1e7;
}

h1{
    text-align:center;
    color:#1b5e20;
    margin-bottom:20px;
}

.form-box{
    background:white;
    padding:25px;
    border-radius:16px;
    margin-bottom:30px;
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

input, textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
}

.time-row{
    display:flex;
    gap:10px;
}

.time-row input{
    flex:1;
}

.form-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:10px;
}

button{
    padding:10px 18px;
    border:none;
    background:#5f7661;
    color:white;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#4b5f4d;
}

.secondary-btn{
    background:#90a4ae;
}

.secondary-btn:hover{
    background:#78909c;
}

.event-card{
    background:white;
    padding:20px;
    margin-bottom:15px;
    border-radius:14px;
    box-shadow:0 6px 15px rgba(0,0,0,0.1);
}

.event-card h3{
    color:#2e7d32;
    margin-bottom:10px;
}

a{
    color:#729cc1;
}

a:hover{
    text-decoration:underline;
}

.badge-new{
    background:red;
    color:white;
    font-size:12px;
    padding:3px 8px;
    border-radius:10px;
    margin-left:8px;
}

.pinned-card{
    border:2px solid #ff9800;
    background:linear-gradient(135deg,#fff8e1,#ffffff);
    box-shadow:0 10px 30px rgba(255,152,0,0.4);
    transform:scale(1.02);
}

.featured-badge{
    display:inline-block;
    background:#ff9800;
    color:white;
    font-size:12px;
    padding:4px 10px;
    border-radius:12px;
    margin-left:8px;
}

.filter-wrap{
    margin-bottom:15px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.empty-box{
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 6px 15px rgba(0,0,0,0.08);
    color:#666;
}
</style>
</head>

<body>

<div class="container">

  <div class="top-bar">
    <a href="/officer_dashboard" class="back-btn">← Back to Officer Dashboard</a>
  </div>

  <h1>📅 Publish Recycling Event</h1>

  <div class="form-box">
      <input type="text" id="title" placeholder="Event Title">
      <input type="date" id="date">

      <div class="time-row">
          <input type="time" id="startTime">
          <input type="time" id="endTime">
      </div>

      <input type="text" id="location" placeholder="Location">
      <textarea id="desc" placeholder="Description"></textarea>

      <div class="form-actions">
        <button type="button" onclick="saveEvent()">Publish Event</button>
        <button type="button" class="secondary-btn" onclick="clearForm()">Clear Form</button>
      </div>
  </div>

  <h2>📅 Latest Events</h2>

  <div class="filter-wrap">
      <button onclick="filterEvents('all')">All</button>
      <button onclick="filterEvents('today')">Today</button>
      <button onclick="filterEvents('upcoming')">Upcoming</button>
      <button onclick="filterEvents('past')">Past</button>
  </div>

  <div id="eventList"></div>

</div>

<script>
function getYouTubeId(url){
    let id = "";

    if(url.includes("youtu.be")){
        id = url.split("youtu.be/")[1] || "";
    }

    if(url.includes("watch?v=")){
        id = url.split("v=")[1] || "";
    }

    if(id.includes("&")) id = id.split("&")[0];
    if(id.includes("?")) id = id.split("?")[0];

    return id;
}

function formatText(text){
    const urlPattern = /(https?:\/\/[^\s]+)/g;

    return text.replace(urlPattern, url => {
        if(url.includes("youtube.com") || url.includes("youtu.be")){
            const videoId = getYouTubeId(url);

            if(!videoId){
                return `
                    <a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>
                `;
            }

            return `
                <div>
                    <a href="${url}" target="_blank" rel="noopener noreferrer">▶ Watch Video</a>
                    <p style="font-size:12px;color:gray;">🎥 External video link (open in YouTube)</p>
                </div>
            `;
        }

        return `
            <a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>
        `;
    });
}

function formatTime(t){
    if(!t) return "";
    let [h,m] = t.split(":");
    h = parseInt(h, 10);
    const ampm = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    return h + ":" + m + " " + ampm;
}

function isNewEvent(dateStr){
    const today = new Date().toISOString().split("T")[0];
    const diffTime = new Date(dateStr) - new Date(today);
    const diffDays = diffTime / (1000 * 60 * 60 * 24);
    return diffDays > 0 && diffDays <= 3;
}

function showToast(msg){
    const t = document.createElement("div");
    t.innerText = msg;
    t.style.position = "fixed";
    t.style.bottom = "20px";
    t.style.right = "20px";
    t.style.background = "#2e7d32";
    t.style.color = "white";
    t.style.padding = "10px 14px";
    t.style.borderRadius = "8px";
    t.style.zIndex = "9999";
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2000);
}

let events = [];
let editId = null;
let currentFilter = "all";

function filterEvents(type){
    currentFilter = type;
    renderEvents();
}

async function loadEvents(){
    try{
        const response = await fetch("/api/events");
        const data = await response.json();

        if(!data.success){
            document.getElementById("eventList").innerHTML = `<div class="empty-box">Failed to load events.</div>`;
            return;
        }

        events = data.events || [];
        renderEvents();
    }catch(error){
        console.error("Failed to load events:", error);
        document.getElementById("eventList").innerHTML = `<div class="empty-box">Failed to load events.</div>`;
    }
}

function renderEvents(){
    const list = document.getElementById("eventList");
    list.innerHTML = "";

    const sortedEvents = [...events].sort((a,b) => {
        if(a.pinned && !b.pinned) return -1;
        if(!a.pinned && b.pinned) return 1;
        return new Date(b.date) - new Date(a.date);
    });

    const today = new Date().toISOString().split("T")[0];
    let filtered = sortedEvents;

    if(currentFilter === "today"){
        filtered = sortedEvents.filter(e => e.date === today);
    }

    if(currentFilter === "upcoming"){
        filtered = sortedEvents.filter(e => e.date > today);
    }

    if(currentFilter === "past"){
        filtered = sortedEvents.filter(e => e.date < today);
    }

    if(filtered.length === 0){
        list.innerHTML = `<div class="empty-box">No events found.</div>`;
        return;
    }

    filtered.forEach((e) => {
        list.innerHTML += `
        <div class="event-card ${e.pinned ? 'pinned-card' : ''}">
            <h3>
                ${e.pinned ? '📌 Featured Event ' : ''}
                ${e.title}
                ${isNewEvent(e.date) ? '<span class="badge-new">NEW</span>' : ''}
                ${e.pinned ? '<span class="featured-badge">HOT</span>' : ''}
            </h3>

            <p><strong>Date:</strong> ${e.date}</p>
            <p><strong>Time:</strong> ${formatTime(e.startTime)} - ${formatTime(e.endTime)}</p>

            <p>
                📍 <strong>Location:</strong>
                <a href="https://www.google.com/maps/search/${encodeURIComponent(e.location)}"
                   target="_blank">${e.location}</a>
            </p>

            ${e.pinned ? '<p style="color:#e65100;font-weight:bold;">🔥 Don’t miss this event!</p>' : ''}

            <p>${formatText(e.desc)}</p>

            <div class="form-actions">
              <button onclick="editEvent(${e.id})">Edit</button>
              <button onclick="deleteEvent(${e.id})">Delete</button>
              <button onclick="togglePin(${e.id})">${e.pinned ? 'Unpin' : '📌 Pin'}</button>
            </div>
        </div>
        `;
    });
}

async function saveEvent(){
    const title = document.getElementById("title").value.trim();
    const date = document.getElementById("date").value;
    const startTime = document.getElementById("startTime").value;
    const endTime = document.getElementById("endTime").value;
    const location = document.getElementById("location").value.trim();
    const desc = document.getElementById("desc").value.trim();

    if(title === "" || date === "" || startTime === "" || endTime === "" || location === "" || desc === ""){
        alert("Please fill in all fields.");
        return;
    }

    try{
        const response = await fetch("/api/save_event", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                id: editId,
                title,
                date,
                startTime,
                endTime,
                location,
                desc,
                pinned: false
            })
        });

        const result = await response.json();

        if(!result.success){
            alert(result.message || "Failed to save event.");
            return;
        }

        showToast(editId ? "✏️ Event updated successfully!" : "✅ Event published successfully!");
        editId = null;
        clearForm();
        await loadEvents();

    }catch(error){
        console.error("Save event error:", error);
        alert("Failed to save event.");
    }
}

function editEvent(id){
    const e = events.find(item => item.id === id);
    if(!e) return;

    document.getElementById("title").value = e.title;
    document.getElementById("date").value = e.date;
    document.getElementById("startTime").value = e.startTime;
    document.getElementById("endTime").value = e.endTime;
    document.getElementById("location").value = e.location;
    document.getElementById("desc").value = e.desc;

    editId = id;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

async function deleteEvent(id){
    const confirmDelete = confirm("Are you sure you want to delete this event?");
    if(!confirmDelete) return;

    try{
        const response = await fetch(`/api/delete_event/${id}`, {
            method: "DELETE"
        });

        const result = await response.json();

        if(!result.success){
            alert(result.message || "Failed to delete event.");
            return;
        }

        showToast("🗑️ Deleted");
        await loadEvents();

    }catch(error){
        console.error("Delete event error:", error);
        alert("Failed to delete event.");
    }
}

async function togglePin(id){
    try{
        const response = await fetch(`/api/toggle_event_pin/${id}`, {
            method: "POST"
        });

        const result = await response.json();

        if(!result.success){
            alert(result.message || "Failed to update pin status.");
            return;
        }

        await loadEvents();
    }catch(error){
        console.error("Toggle pin error:", error);
        alert("Failed to update pin status.");
    }
}

function clearForm(){
    document.getElementById("title").value = "";
    document.getElementById("date").value = "";
    document.getElementById("startTime").value = "";
    document.getElementById("endTime").value = "";
    document.getElementById("location").value = "";
    document.getElementById("desc").value = "";
    editId = null;
}

loadEvents();
</script>

</body>
</html>
