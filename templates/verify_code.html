<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Verify Code | GreenTrack</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:"Segoe UI", sans-serif;
  background:linear-gradient(135deg,#6f8f7a,#8fae96);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}

/* 卡片 */
.card{
  background:white;
  padding:40px 35px;
  border-radius:16px;
  width:350px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

/* 标题 */
h2{
  color:#2e7d32;
  margin-bottom:8px;
}

/* 副标题 */
.subtitle{
  font-size:14px;
  color:#666;
  margin-bottom:20px;
}

/* 输入框 */
input{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:18px;
  text-align:center;
  letter-spacing:8px;
  margin-top:10px;
  box-sizing:border-box;
}

/* 按钮 */
button{
  margin-top:20px;
  width:100%;
  padding:12px;
  background:#2e7d32;
  color:white;
  border:none;
  border-radius:8px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  background:#1b5e20;
  transform:translateY(-1px);
}

/* 返回 */
.back{
  margin-top:15px;
  display:block;
  color:#2e7d32;
  text-decoration:none;
  font-size:13px;
}

/* 错误 */
.error{
  color: #1f8f5a;
  margin-top:10px;
  font-size:14px;
  font-weight:500;
}

/* footer */
.footer-note{
  position:fixed;
  bottom:12px;
  width:100%;
  text-align:center;
  font-size:13px;
  color:white;
  opacity:0.85;
}
</style>
</head>

<body>

<div class="card">

<h2>Email Verification</h2>
<p class="subtitle">Enter the 4-digit code sent to your email</p>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    <p class="error">{{ messages[0] }}</p>
  {% endif %}
{% endwith %}

<form method="POST" action="/verify_code">
  <input 
    type="text" 
    id="code" 
    name="code" 
    maxlength="4" 
    pattern="[0-9]{4}" 
    placeholder="----" 
    required
  >

  <button type="submit">Verify Code</button>
</form>

<a class="back" href="/forgot_password">← Back to Forgot Password</a>

</div>

<!-- footer -->
<div class="footer-note">
  GreenTrack: A Web-Based Community Recycling Tracking & Ranking System
</div>

</body>
</html>
